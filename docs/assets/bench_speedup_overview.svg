<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="aydbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="aydbHotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" rx="12" fill="#0f172a"/>
  <rect x="1" y="1" width="958" height="578" rx="11" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">aydb Relative Speedup vs. Vanilla SQLite (WAL Mode = 1.0x Baseline)</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Higher is better — Measured on Windows NTFS via identical SQL queries over sqlite3_module</text>

  <!-- Dedicated Legend Row (y = 78..92, generous spacing between items) -->
  <rect x="32" y="78" width="14" height="14" rx="3" fill="url(#aydbHotGrad)"/>
  <text x="52" y="90" fill="#e2e8f0" font-size="12" font-weight="600">aydb Write-Heavy / Sync ACID</text>
  <rect x="300" y="78" width="14" height="14" rx="3" fill="url(#aydbGrad)"/>
  <text x="320" y="90" fill="#e2e8f0" font-size="12" font-weight="600">aydb Read / Scan / Bounded Blob Cache</text>
  <line x1="630" y1="85" x2="660" y2="85" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,4"/>
  <text x="668" y="90" fill="#fbbf24" font-size="12" font-weight="700">Vanilla SQLite Baseline (1.0x)</text>

  <!--Chart Area: x from 260 to 685 (width = 425px for 0x..30x -> 1x = 14.17px). Right label space: 685..940 -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="260" y1="120" x2="260" y2="525" stroke="#475569"/>
    <line x1="331" y1="120" x2="331" y2="525"/>
    <line x1="402" y1="120" x2="402" y2="525"/>
    <line x1="473" y1="120" x2="473" y2="525"/>
    <line x1="543" y1="120" x2="543" y2="525"/>
    <line x1="614" y1="120" x2="614" y2="525"/>
    <line x1="685" y1="120" x2="685" y2="525"/>
  </g>

  <!-- X-axis Labels -->
  <g fill="#94a3b8" font-size="12" text-anchor="middle">
    <text x="260" y="548">0x</text>
    <text x="331" y="548">5x</text>
    <text x="402" y="548">10x</text>
    <text x="473" y="548">15x</text>
    <text x="543" y="548">20x</text>
    <text x="614" y="548">25x</text>
    <text x="685" y="548">30x</text>
  </g>

  <!-- Rows (12 items, y step = 33, starting y = 128, scale: 1x = 14.17px) -->
  <!-- 1. Sync Config Updates (128B): 27.2x -> width = 385 -->
  <text x="248" y="144" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">Sync Config Updates (128 B)</text>
  <rect x="260" y="128" width="385" height="22" rx="4" fill="url(#aydbHotGrad)"/>
  <text x="655" y="144" fill="#f8fafc" font-size="12.5" font-weight="700">27.2x (13,607 vs 500 tx/s)</text>

  <!-- 2. TPC-B-Style Full Sync: 26.04x -> width = 369 -->
  <text x="248" y="177" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">TPC-B-Style OLTP (Full Sync)</text>
  <rect x="260" y="161" width="369" height="22" rx="4" fill="url(#aydbHotGrad)"/>
  <text x="639" y="177" fill="#f8fafc" font-size="12.5" font-weight="700">26.04x (12,864 vs 494 TPS; 21.28x SST)</text>

  <!-- 3. LRU Cache-Hit SELECTs: 10.09x -> width = 143 -->
  <text x="248" y="210" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">LRU Cache-Hit SELECTs</text>
  <rect x="260" y="194" width="143" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="413" y="210" fill="#f8fafc" font-size="12.5" font-weight="700">10.09x (228K vs 22.6K ops/s, 0 MB write)</text>

  <!-- 4. TPC-B-Style Buffered: 6.90x -> width = 98 -->
  <text x="248" y="243" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">TPC-B-Style OLTP (Buffered)</text>
  <rect x="260" y="227" width="98" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="368" y="243" fill="#f8fafc" font-size="12.5" font-weight="700">6.90x (102.8K vs 14.9K TPS; 2.83x SST)</text>

  <!-- 5. YCSB-Style Workload C (100% Read, 256B): 4.38x -> width = 62 -->
  <text x="248" y="276" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-C: 100% Point Read (256 B)</text>
  <rect x="260" y="260" width="62" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="332" y="276" fill="#f8fafc" font-size="12.5" font-weight="700">4.38x (1.25M vs 285K ops/s; 1.42x SST)</text>

  <!-- 6. YCSB-Style Workload D (Read Latest, 256B): 4.20x -> width = 60 -->
  <text x="248" y="309" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-D: Read Latest (256 B)</text>
  <rect x="260" y="293" width="60" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="330" y="309" fill="#f8fafc" font-size="12.5" font-weight="700">4.20x (928K vs 221K ops/s)</text>

  <!-- 7. YCSB-Style Workload B (95/5 R/U, 256B): 3.35x -> width = 47 -->
  <text x="248" y="342" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-B: 95/5 R/U (256 B)</text>
  <rect x="260" y="326" width="47" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="317" y="342" fill="#f8fafc" font-size="12.5" font-weight="700">3.35x (895K vs 267K ops/s; 1.17x SST)</text>

  <!-- 8. Speedtest1-Style #130 (PK SELECT): 2.70x -> width = 38 -->
  <text x="248" y="375" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">Speedtest1 #130 (PK SELECT)</text>
  <rect x="260" y="359" width="38" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="308" y="375" fill="#f8fafc" font-size="12.5" font-weight="700">2.70x (5.33 ms vs 14.37 ms)</text>

  <!-- 9. YCSB-Style Workload E (Short Range, 256B): 2.55x -> width = 36 -->
  <text x="248" y="408" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-E: Short Range (256 B)</text>
  <rect x="260" y="392" width="36" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="306" y="408" fill="#f8fafc" font-size="12.5" font-weight="700">2.55x (266K vs 104K ops/s)</text>

  <!-- 10. YCSB-Style Workload A (50/50 R/U, 256B): 1.85x -> width = 26 -->
  <text x="248" y="441" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-A: 50/50 R/U (256 B)</text>
  <rect x="260" y="425" width="26" height="22" rx="4" fill="url(#aydbHotGrad)"/>
  <text x="296" y="441" fill="#f8fafc" font-size="12.5" font-weight="700">1.85x (294K vs 159K ops/s)</text>

  <!-- 11. 16 KB Blob Cache (4 MB Cap): 1.36x -> width = 19 -->
  <text x="248" y="474" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">16 KB Blob Cache (4 MB Cap)</text>
  <rect x="260" y="458" width="19" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="289" y="474" fill="#f8fafc" font-size="12.5" font-weight="700">1.36x (92.8 vs 68.2 MB/s, 0.5x disk)</text>

  <!-- 12. Speedtest1-Style Suite Total (ImmediateOsCache): 0.79x -> width = 11 -->
  <text x="248" y="507" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">Speedtest1-Style Suite Total</text>
  <rect x="260" y="491" width="11" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="281" y="507" fill="#38bdf8" font-size="12.5" font-weight="700">0.79x (74.78 ms vs 59.21 ms; 0.27x SST)</text>

  <!-- 1.0x SQLite Baseline Line (drawn at x = 260 + 14 = 274) -->
  <line x1="274" y1="115" x2="274" y2="528" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="274" y="111" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">1.0x</text>
</svg>
