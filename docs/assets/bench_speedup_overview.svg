<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="aydbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="aydbHotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" rx="12" fill="#0f172a"/>
  <rect x="1" y="1" width="958" height="578" rx="11" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">aydb Relative Speedup vs. Vanilla SQLite (WAL Mode = 1.0x Baseline)</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Higher is better — Measured on Windows NTFS via identical SQL queries over sqlite3_module</text>

  <!-- Dedicated Legend Row (y = 78..92, generous spacing between items) -->
  <rect x="32" y="78" width="14" height="14" rx="3" fill="url(#aydbHotGrad)"/>
  <text x="52" y="90" fill="#e2e8f0" font-size="12" font-weight="600">aydb Write-Heavy / Sync ACID</text>
  <rect x="300" y="78" width="14" height="14" rx="3" fill="url(#aydbGrad)"/>
  <text x="320" y="90" fill="#e2e8f0" font-size="12" font-weight="600">aydb Read / Scan / Bounded Blob Cache</text>
  <line x1="630" y1="85" x2="660" y2="85" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,4"/>
  <text x="668" y="90" fill="#fbbf24" font-size="12" font-weight="700">Vanilla SQLite Baseline (1.0x)</text>

  <!--Chart Area: x from 260 to 685 (width = 425px for 0x..30x -> 1x = 14.17px). Right label space: 685..940 -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="260" y1="120" x2="260" y2="525" stroke="#475569"/>
    <line x1="331" y1="120" x2="331" y2="525"/>
    <line x1="402" y1="120" x2="402" y2="525"/>
    <line x1="473" y1="120" x2="473" y2="525"/>
    <line x1="543" y1="120" x2="543" y2="525"/>
    <line x1="614" y1="120" x2="614" y2="525"/>
    <line x1="685" y1="120" x2="685" y2="525"/>
  </g>

  <!-- X-axis Labels -->
  <g fill="#94a3b8" font-size="12" text-anchor="middle">
    <text x="260" y="548">0x</text>
    <text x="331" y="548">5x</text>
    <text x="402" y="548">10x</text>
    <text x="473" y="548">15x</text>
    <text x="543" y="548">20x</text>
    <text x="614" y="548">25x</text>
    <text x="685" y="548">30x</text>
  </g>

  <!-- Rows (12 items, y step = 33, starting y = 128, scale: 1x = 14.17px) -->
  <!-- 1. Sync Config Updates (128B): 15.0x -> width = 213 -->
  <text x="248" y="144" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">Sync Config Updates (128 B)</text>
  <rect x="260" y="128" width="213" height="22" rx="4" fill="url(#aydbHotGrad)"/>
  <text x="483" y="144" fill="#f8fafc" font-size="12.5" font-weight="700">15.0x (15,467 vs 1,032 tx/s)</text>

  <!-- 2. TPC-B-Style Full Sync: 13.15x -> width = 186 -->
  <text x="248" y="177" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">TPC-B-Style OLTP (Full Sync)</text>
  <rect x="260" y="161" width="186" height="22" rx="4" fill="url(#aydbHotGrad)"/>
  <text x="456" y="177" fill="#f8fafc" font-size="12.5" font-weight="700">13.15x (13,110 vs 997 TPS; 12.32x SST)</text>

  <!-- 3. LRU Cache-Hit SELECTs: 8.09x -> width = 115 -->
  <text x="248" y="210" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">LRU Cache-Hit SELECTs</text>
  <rect x="260" y="194" width="115" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="385" y="210" fill="#f8fafc" font-size="12.5" font-weight="700">8.09x (223K vs 27.5K ops/s, 0 MB write)</text>

  <!-- 4. TPC-B-Style Buffered: 4.91x -> width = 70 -->
  <text x="248" y="243" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">TPC-B-Style OLTP (Buffered)</text>
  <rect x="260" y="227" width="70" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="340" y="243" fill="#f8fafc" font-size="12.5" font-weight="700">4.91x (98.1K vs 20.0K TPS; 2.48x SST)</text>

  <!-- 5. YCSB-Style Workload C (100% Read, 256B): 3.93x -> width = 56 -->
  <text x="248" y="276" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-C: 100% Point Read (256 B)</text>
  <rect x="260" y="260" width="56" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="326" y="276" fill="#f8fafc" font-size="12.5" font-weight="700">3.93x (1.17M vs 298K ops/s; 1.39x SST)</text>

  <!-- 6. YCSB-Style Workload D (Read Latest, 256B): 3.87x -> width = 55 -->
  <text x="248" y="309" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-D: Read Latest (256 B)</text>
  <rect x="260" y="293" width="55" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="325" y="309" fill="#f8fafc" font-size="12.5" font-weight="700">3.87x (815K vs 211K ops/s)</text>

  <!-- 7. Speedtest1-Style #130 (PK SELECT): 3.01x -> width = 43 -->
  <text x="248" y="342" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">Speedtest1 #130 (PK SELECT)</text>
  <rect x="260" y="326" width="43" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="313" y="342" fill="#f8fafc" font-size="12.5" font-weight="700">3.01x (4.89 ms vs 14.70 ms)</text>

  <!-- 8. YCSB-Style Workload B (95/5 R/U, 256B): 2.96x -> width = 42 -->
  <text x="248" y="375" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-B: 95/5 R/U (256 B)</text>
  <rect x="260" y="359" width="42" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="312" y="375" fill="#f8fafc" font-size="12.5" font-weight="700">2.96x (848K vs 286K ops/s; 1.20x SST)</text>

  <!-- 9. Speedtest1-Style #140 (SecIdx SELECT): 2.23x -> width = 32 -->
  <text x="248" y="408" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">Speedtest1 #140 (SecIdx SELECT)</text>
  <rect x="260" y="392" width="32" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="302" y="408" fill="#f8fafc" font-size="12.5" font-weight="700">2.23x (7.25 ms vs 16.17 ms)</text>

  <!-- 10. 16 KB Blob Cache (4 MB Cap): 1.66x -> width = 24 -->
  <text x="248" y="441" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">16 KB Blob Cache (4 MB Cap)</text>
  <rect x="260" y="425" width="24" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="294" y="441" fill="#f8fafc" font-size="12.5" font-weight="700">1.66x (154.1 vs 92.6 MB/s, 0.5x disk)</text>

  <!-- 11. YCSB-Style Workload F (50/50 RMW, 256B): 1.51x -> width = 21 -->
  <text x="248" y="474" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-F: 50/50 RMW (256 B)</text>
  <rect x="260" y="458" width="21" height="22" rx="4" fill="url(#aydbHotGrad)"/>
  <text x="291" y="474" fill="#f8fafc" font-size="12.5" font-weight="700">1.51x (253K vs 168K ops/s)</text>

  <!-- 12. Speedtest1-Style Suite Total (ImmediateOsCache): 0.84x -> width = 12 -->
  <text x="248" y="507" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">Speedtest1-Style Suite Total</text>
  <rect x="260" y="491" width="12" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="282" y="507" fill="#38bdf8" font-size="12.5" font-weight="700">0.84x (74.17 ms vs 62.59 ms; 0.31x SST)</text>

  <!-- 1.0x SQLite Baseline Line (drawn at x = 260 + 14 = 274) -->
  <line x1="274" y1="115" x2="274" y2="528" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="274" y="111" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">1.0x</text>
</svg>
