<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="aydbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="aydbHotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" rx="12" fill="#0f172a"/>
  <rect x="1" y="1" width="958" height="578" rx="11" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">aydb Relative Speedup vs. Vanilla SQLite (WAL Mode = 1.0x Baseline)</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Higher is better — Measured on Windows NTFS via identical SQL queries over sqlite3_module</text>

  <!-- Dedicated Legend Row (y = 78..92, generous spacing between items) -->
  <rect x="32" y="78" width="14" height="14" rx="3" fill="url(#aydbHotGrad)"/>
  <text x="52" y="90" fill="#e2e8f0" font-size="12" font-weight="600">aydb Write-Heavy / Sync ACID</text>
  <rect x="300" y="78" width="14" height="14" rx="3" fill="url(#aydbGrad)"/>
  <text x="320" y="90" fill="#e2e8f0" font-size="12" font-weight="600">aydb Read / Scan / Bounded Blob Cache</text>
  <line x1="630" y1="85" x2="660" y2="85" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,4"/>
  <text x="668" y="90" fill="#fbbf24" font-size="12" font-weight="700">Vanilla SQLite Baseline (1.0x)</text>

  <!-- Chart Area: x from 260 to 685 (width = 425px for 0x..25x -> 1x = 17px). Right label space: 685..940 -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="260" y1="120" x2="260" y2="525" stroke="#475569"/>
    <line x1="345" y1="120" x2="345" y2="525"/>
    <line x1="430" y1="120" x2="430" y2="525"/>
    <line x1="515" y1="120" x2="515" y2="525"/>
    <line x1="600" y1="120" x2="600" y2="525"/>
    <line x1="685" y1="120" x2="685" y2="525"/>
  </g>

  <!-- X-axis Labels -->
  <g fill="#94a3b8" font-size="12" text-anchor="middle">
    <text x="260" y="548">0x</text>
    <text x="345" y="548">5x</text>
    <text x="430" y="548">10x</text>
    <text x="515" y="548">15x</text>
    <text x="600" y="548">20x</text>
    <text x="685" y="548">25x</text>
  </g>

  <!-- Rows (12 items, y step = 33, starting y = 128, scale: 1x = 17px) -->
  <!-- 1. Sync Config Updates (128B): 23.4x -> width = 398 -->
  <text x="248" y="144" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">Sync Config Updates (128 B)</text>
  <rect x="260" y="128" width="398" height="22" rx="4" fill="url(#aydbHotGrad)"/>
  <text x="668" y="144" fill="#f8fafc" font-size="12.5" font-weight="700">23.4x (12,523 vs 535 tx/s)</text>

  <!-- 2. TPC-B Full Sync: 18.85x -> width = 320 -->
  <text x="248" y="177" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">TPC-B OLTP (Full Sync)</text>
  <rect x="260" y="161" width="320" height="22" rx="4" fill="url(#aydbHotGrad)"/>
  <text x="590" y="177" fill="#f8fafc" font-size="12.5" font-weight="700">18.85x (10,668 vs 566 TPS)</text>

  <!-- 3. LRU Cache-Hit SELECTs: 8.06x -> width = 137 -->
  <text x="248" y="210" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">LRU Cache-Hit SELECTs</text>
  <rect x="260" y="194" width="137" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="407" y="210" fill="#f8fafc" font-size="12.5" font-weight="700">8.06x (194K vs 24.0K ops/s, 0 MB write)</text>

  <!-- 4. TPC-B Buffered: 7.22x -> width = 123 -->
  <text x="248" y="243" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">TPC-B OLTP (Buffered)</text>
  <rect x="260" y="227" width="123" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="393" y="243" fill="#f8fafc" font-size="12.5" font-weight="700">7.22x (112.6K vs 15.6K TPS)</text>

  <!-- 5. YCSB Workload C (100% Read, 256B): 4.42x -> width = 75 -->
  <text x="248" y="276" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-C: 100% Point Read (256 B)</text>
  <rect x="260" y="260" width="75" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="345" y="276" fill="#f8fafc" font-size="12.5" font-weight="700">4.42x (1.22M vs 275K ops/s)</text>

  <!-- 6. YCSB Workload D (Read Latest, 256B): 3.90x -> width = 66 -->
  <text x="248" y="309" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-D: Read Latest (256 B)</text>
  <rect x="260" y="293" width="66" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="336" y="309" fill="#f8fafc" font-size="12.5" font-weight="700">3.90x (748K vs 191K ops/s)</text>

  <!-- 7. YCSB Workload B (95/5 R/U, 256B): 3.37x -> width = 57 -->
  <text x="248" y="342" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-B: 95/5 R/U (256 B)</text>
  <rect x="260" y="326" width="57" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="327" y="342" fill="#f8fafc" font-size="12.5" font-weight="700">3.37x (872K vs 259K ops/s)</text>

  <!-- 8. Speedtest1 #130 (PK SELECT): 3.37x -> width = 57 -->
  <text x="248" y="375" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">Speedtest1 #130 (PK SELECT)</text>
  <rect x="260" y="359" width="57" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="327" y="375" fill="#f8fafc" font-size="12.5" font-weight="700">3.37x (4.92 ms vs 16.54 ms)</text>

  <!-- 9. 16 KB Blob Cache (4 MB Cap): 2.42x -> width = 41 -->
  <text x="248" y="408" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">16 KB Blob Cache (4 MB Cap)</text>
  <rect x="260" y="392" width="41" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="311" y="408" fill="#f8fafc" font-size="12.5" font-weight="700">2.42x (167.1 vs 69.0 MB/s, 0.5x disk)</text>

  <!-- 10. YCSB Workload F (50/50 RMW, 256B): 1.56x -> width = 27 -->
  <text x="248" y="441" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-F: 50/50 RMW (256 B)</text>
  <rect x="260" y="425" width="27" height="22" rx="4" fill="url(#aydbHotGrad)"/>
  <text x="297" y="441" fill="#f8fafc" font-size="12.5" font-weight="700">1.56x (240K vs 154K ops/s)</text>

  <!-- 11. YCSB Workload A (50/50 R/U, 256B): 1.33x -> width = 23 -->
  <text x="248" y="474" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">YCSB-A: 50/50 R/U (256 B)</text>
  <rect x="260" y="458" width="23" height="22" rx="4" fill="url(#aydbHotGrad)"/>
  <text x="293" y="474" fill="#f8fafc" font-size="12.5" font-weight="700">1.33x (278K vs 209K ops/s)</text>

  <!-- 12. Speedtest1 Full Suite Total: 1.11x -> width = 19 -->
  <text x="248" y="507" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="end">Speedtest1 Full Suite Total</text>
  <rect x="260" y="491" width="19" height="22" rx="4" fill="url(#aydbGrad)"/>
  <text x="290" y="507" fill="#38bdf8" font-size="12.5" font-weight="700">1.11x Overall Win (63.12 ms vs 70.06 ms)</text>

  <!-- 1.0x SQLite Baseline Line (drawn at x = 260 + 17 = 277) -->
  <line x1="277" y1="115" x2="277" y2="528" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="277" y="111" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">1.0x</text>
</svg>
