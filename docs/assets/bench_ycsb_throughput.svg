<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="aydbBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sqliteBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="12" fill="#0f172a"/>
  <rect x="1" y="1" width="958" height="518" rx="11" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">YCSB Workloads A–F Throughput Comparison (Zipfian θ = 0.99)</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Throughput in thousand ops/sec (kops/s, Higher is better) — Left: 256 B Inline | Right: 2,048 B WiscKey Blob</text>

  <!-- Dedicated Legend Row (y = 78..92, generous spacing) -->
  <rect x="32" y="78" width="14" height="14" rx="3" fill="url(#sqliteBar)"/>
  <text x="52" y="90" fill="#cbd5e1" font-size="12" font-weight="600">Vanilla SQLite (WAL Mode, NORMAL)</text>
  <rect x="340" y="78" width="14" height="14" rx="3" fill="url(#aydbBar)"/>
  <text x="360" y="90" fill="#38bdf8" font-size="12" font-weight="700">aydb Virtual Table (Buffered Dual-Stream WAL)</text>

  <!-- ==================== LEFT PANEL: 256 B Inline (Max = 1,300 kops/s, height = 280px, y: 155..435) ==================== -->
  <text x="260" y="126" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">256 B Inline Records (kops/s)</text>

  <!-- Left Gridlines: 0 (435), 325 (365), 650 (295), 975 (225), 1300 (155) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="70" y1="435" x2="455" y2="435" stroke="#475569"/>
    <line x1="70" y1="365" x2="455" y2="365"/>
    <line x1="70" y1="295" x2="455" y2="295"/>
    <line x1="70" y1="225" x2="455" y2="225"/>
    <line x1="70" y1="155" x2="455" y2="155"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="62" y="439">0</text>
    <text x="62" y="369">325K</text>
    <text x="62" y="299">650K</text>
    <text x="62" y="229">975K</text>
    <text x="62" y="159">1,300K</text>
  </g>

  <!-- Scale for Left Panel: h = val_kops * (280 / 1300) = val_kops * 0.21538 -->
  <!-- Workload A (50/50 R/U): SQLite 209.1K (h=45, y=390), aydb 278.0K (h=60, y=375) -->
  <rect x="82" y="390" width="20" height="45" rx="2" fill="url(#sqliteBar)"/>
  <rect x="106" y="375" width="20" height="60" rx="2" fill="url(#aydbBar)"/>
  <text x="116" y="365" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">278K</text>
  <text x="104" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="104" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 R/U</text>
  <text x="104" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.33x</text>

  <!-- Workload B (95/5 R/U): SQLite 258.9K (h=56, y=379), aydb 871.7K (h=188, y=247) -->
  <rect x="145" y="379" width="20" height="56" rx="2" fill="url(#sqliteBar)"/>
  <rect x="169" y="247" width="20" height="188" rx="2" fill="url(#aydbBar)"/>
  <text x="179" y="237" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">872K</text>
  <text x="167" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="167" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">95/5 R/U</text>
  <text x="167" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">3.37x</text>

  <!-- Workload C (100% Read): SQLite 274.9K (h=59, y=376), aydb 1216.1K (h=262, y=173) -->
  <rect x="208" y="376" width="20" height="59" rx="2" fill="url(#sqliteBar)"/>
  <rect x="232" y="173" width="20" height="262" rx="2" fill="url(#aydbBar)"/>
  <text x="242" y="163" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">1,216K</text>
  <text x="230" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="230" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">100% Read</text>
  <text x="230" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">4.42x</text>

  <!-- Workload D (Read Latest): SQLite 191.5K (h=41, y=394), aydb 747.5K (h=161, y=274) -->
  <rect x="271" y="394" width="20" height="41" rx="2" fill="url(#sqliteBar)"/>
  <rect x="295" y="274" width="20" height="161" rx="2" fill="url(#aydbBar)"/>
  <text x="305" y="264" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">748K</text>
  <text x="293" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">D</text>
  <text x="293" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Latest</text>
  <text x="293" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">3.90x</text>

  <!-- Workload E (Short Range): SQLite 96.6K (h=21, y=414), aydb 224.6K (h=48, y=387) -->
  <rect x="334" y="414" width="20" height="21" rx="2" fill="url(#sqliteBar)"/>
  <rect x="358" y="387" width="20" height="48" rx="2" fill="url(#aydbBar)"/>
  <text x="368" y="377" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">225K</text>
  <text x="356" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="356" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Range(10)</text>
  <text x="356" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">2.33x</text>

  <!-- Workload F (50/50 RMW): SQLite 153.9K (h=33, y=402), aydb 240.4K (h=52, y=383) -->
  <rect x="397" y="402" width="20" height="33" rx="2" fill="url(#sqliteBar)"/>
  <rect x="421" y="383" width="20" height="52" rx="2" fill="url(#aydbBar)"/>
  <text x="431" y="373" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">240K</text>
  <text x="419" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">F</text>
  <text x="419" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 RMW</text>
  <text x="419" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.56x</text>

  <!-- ==================== RIGHT PANEL: 2,048 B WiscKey Separated (Max = 220 kops/s, height = 280px, y: 155..435) ==================== -->
  <text x="735" y="126" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">2,048 B WiscKey Blob Records (kops/s)</text>

  <!-- Right Gridlines: 0 (435), 55 (365), 110 (295), 165 (225), 220 (155) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="540" y1="435" x2="925" y2="435" stroke="#475569"/>
    <line x1="540" y1="365" x2="925" y2="365"/>
    <line x1="540" y1="295" x2="925" y2="295"/>
    <line x1="540" y1="225" x2="925" y2="225"/>
    <line x1="540" y1="155" x2="925" y2="155"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="532" y="439">0</text>
    <text x="532" y="369">55K</text>
    <text x="532" y="299">110K</text>
    <text x="532" y="229">165K</text>
    <text x="532" y="159">220K</text>
  </g>

  <!-- Scale for Right Panel: h = val_kops * (280 / 220) = val_kops * 1.2727 -->
  <!-- Workload A (50/50 R/U): SQLite 133.9K (h=170, y=265), aydb 81.8K (h=104, y=331) -->
  <rect x="552" y="265" width="20" height="170" rx="2" fill="url(#sqliteBar)"/>
  <rect x="576" y="331" width="20" height="104" rx="2" fill="url(#aydbBar)"/>
  <text x="586" y="321" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">82K</text>
  <text x="574" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="574" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 R/U</text>
  <text x="574" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.61x</text>

  <!-- Workload B (95/5 R/U): SQLite 152.7K (h=194, y=241), aydb 148.4K (h=189, y=246) -->
  <rect x="615" y="241" width="20" height="194" rx="2" fill="url(#sqliteBar)"/>
  <rect x="639" y="246" width="20" height="189" rx="2" fill="url(#aydbBar)"/>
  <text x="649" y="231" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">148K</text>
  <text x="637" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="637" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">95/5 R/U</text>
  <text x="637" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.97x</text>

  <!-- Workload C (100% Read): SQLite 171.7K (h=219, y=216), aydb 171.3K (h=218, y=217) -->
  <rect x="678" y="216" width="20" height="219" rx="2" fill="url(#sqliteBar)"/>
  <rect x="702" y="217" width="20" height="218" rx="2" fill="url(#aydbBar)"/>
  <text x="712" y="206" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">171K</text>
  <text x="700" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="700" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">100% Read</text>
  <text x="700" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.00x</text>

  <!-- Workload D (Read Latest): SQLite 94.3K (h=120, y=315), aydb 162.5K (h=207, y=228) -->
  <rect x="741" y="315" width="20" height="120" rx="2" fill="url(#sqliteBar)"/>
  <rect x="765" y="228" width="20" height="207" rx="2" fill="url(#aydbBar)"/>
  <text x="775" y="218" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">162K</text>
  <text x="763" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">D</text>
  <text x="763" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Latest</text>
  <text x="763" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.72x</text>

  <!-- Workload E (Short Range): SQLite 40.6K (h=52, y=383), aydb 20.6K (h=26, y=409) -->
  <rect x="804" y="383" width="20" height="52" rx="2" fill="url(#sqliteBar)"/>
  <rect x="828" y="409" width="20" height="26" rx="2" fill="url(#aydbBar)"/>
  <text x="838" y="374" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">21K</text>
  <text x="826" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="826" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Range(10)</text>
  <text x="826" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.51x</text>

  <!-- Workload F (50/50 RMW): SQLite 106.6K (h=136, y=299), aydb 67.2K (h=86, y=349) -->
  <rect x="867" y="299" width="20" height="136" rx="2" fill="url(#sqliteBar)"/>
  <rect x="891" y="349" width="20" height="86" rx="2" fill="url(#aydbBar)"/>
  <text x="901" y="339" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">67K</text>
  <text x="889" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">F</text>
  <text x="889" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 RMW</text>
  <text x="889" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.63x</text>
</svg>
