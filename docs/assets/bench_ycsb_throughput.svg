<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="aydbBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sqliteBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="12" fill="#0f172a"/>
  <rect x="1" y="1" width="958" height="518" rx="11" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">YCSB-Style Workloads A–F Throughput Comparison (Zipfian θ = 0.99)</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Throughput in thousand ops/sec (kops/s, Higher is better) — Left: 256 B Inline | Right: 2,048 B WiscKey Blob</text>

  <!-- Dedicated Legend Row (y = 78..92, generous spacing) -->
  <rect x="32" y="78" width="14" height="14" rx="3" fill="url(#sqliteBar)"/>
  <text x="52" y="90" fill="#cbd5e1" font-size="12" font-weight="600">Vanilla SQLite (WAL Mode, NORMAL)</text>
  <rect x="340" y="78" width="14" height="14" rx="3" fill="url(#aydbBar)"/>
  <text x="360" y="90" fill="#38bdf8" font-size="12" font-weight="700">aydb Virtual Table (Buffered Dual-Stream WAL)</text>

  <!-- ==================== LEFT PANEL: 256 B Inline (Max = 1,300 kops/s, height = 280px, y: 155..435) ==================== -->
  <text x="260" y="126" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">256 B Inline Records (kops/s)</text>

  <!-- Left Gridlines: 0 (435), 325 (365), 650 (295), 975 (225), 1300 (155) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="70" y1="435" x2="455" y2="435" stroke="#475569"/>
    <line x1="70" y1="365" x2="455" y2="365"/>
    <line x1="70" y1="295" x2="455" y2="295"/>
    <line x1="70" y1="225" x2="455" y2="225"/>
    <line x1="70" y1="155" x2="455" y2="155"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="62" y="439">0</text>
    <text x="62" y="369">325K</text>
    <text x="62" y="299">650K</text>
    <text x="62" y="229">975K</text>
    <text x="62" y="159">1,300K</text>
  </g>

  <!-- Scale for Left Panel: h = val_kops * (280 / 1300) = val_kops * 0.21538 -->
  <!-- Workload A (50/50 R/U): SQLite 233.4K (h=50, y=385), aydb 286.0K (h=62, y=373) -->
  <rect x="82" y="385" width="20" height="50" rx="2" fill="url(#sqliteBar)"/>
  <rect x="106" y="373" width="20" height="62" rx="2" fill="url(#aydbBar)"/>
  <text x="116" y="363" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">286K</text>
  <text x="104" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="104" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 R/U</text>
  <text x="104" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.23x</text>

  <!-- Workload B (95/5 R/U): SQLite 289.4K (h=62, y=373), aydb 775.7K (h=167, y=268) -->
  <rect x="145" y="373" width="20" height="62" rx="2" fill="url(#sqliteBar)"/>
  <rect x="169" y="268" width="20" height="167" rx="2" fill="url(#aydbBar)"/>
  <text x="179" y="258" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">776K</text>
  <text x="167" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="167" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">95/5 R/U</text>
  <text x="167" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">2.68x</text>

  <!-- Workload C (100% Read): SQLite 300.7K (h=65, y=370), aydb 973.6K (h=210, y=225) -->
  <rect x="208" y="370" width="20" height="65" rx="2" fill="url(#sqliteBar)"/>
  <rect x="232" y="225" width="20" height="210" rx="2" fill="url(#aydbBar)"/>
  <text x="242" y="215" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">974K</text>
  <text x="230" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="230" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">100% Read</text>
  <text x="230" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">3.24x</text>

  <!-- Workload D (Read Latest): SQLite 196.8K (h=42, y=393), aydb 751.9K (h=162, y=273) -->
  <rect x="271" y="393" width="20" height="42" rx="2" fill="url(#sqliteBar)"/>
  <rect x="295" y="273" width="20" height="162" rx="2" fill="url(#aydbBar)"/>
  <text x="305" y="263" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">752K</text>
  <text x="293" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">D</text>
  <text x="293" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Latest</text>
  <text x="293" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">3.82x</text>

  <!-- Workload E (Short Range): SQLite 101.6K (h=22, y=413), aydb 48.4K (h=10, y=425) -->
  <rect x="334" y="413" width="20" height="22" rx="2" fill="url(#sqliteBar)"/>
  <rect x="358" y="425" width="20" height="10" rx="2" fill="url(#aydbBar)"/>
  <text x="368" y="415" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">48K</text>
  <text x="356" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="356" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Range(10)</text>
  <text x="356" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.48x</text>

  <!-- Workload F (50/50 RMW): SQLite 174.3K (h=38, y=397), aydb 242.7K (h=52, y=383) -->
  <rect x="397" y="397" width="20" height="38" rx="2" fill="url(#sqliteBar)"/>
  <rect x="421" y="383" width="20" height="52" rx="2" fill="url(#aydbBar)"/>
  <text x="431" y="373" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">243K</text>
  <text x="419" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">F</text>
  <text x="419" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 RMW</text>
  <text x="419" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.39x</text>

  <!-- ==================== RIGHT PANEL: 2,048 B WiscKey Separated (Max = 500 kops/s, height = 280px, y: 155..435) ==================== -->
  <text x="735" y="126" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">2,048 B WiscKey Blob Records (kops/s)</text>

  <!-- Right Gridlines: 0 (435), 125 (365), 250 (295), 375 (225), 500 (155) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="540" y1="435" x2="925" y2="435" stroke="#475569"/>
    <line x1="540" y1="365" x2="925" y2="365"/>
    <line x1="540" y1="295" x2="925" y2="295"/>
    <line x1="540" y1="225" x2="925" y2="225"/>
    <line x1="540" y1="155" x2="925" y2="155"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="532" y="439">0</text>
    <text x="532" y="369">125K</text>
    <text x="532" y="299">250K</text>
    <text x="532" y="229">375K</text>
    <text x="532" y="159">500K</text>
  </g>

  <!-- Scale for Right Panel: h = val_kops * (280 / 500) = val_kops * 0.56 -->
  <!-- Workload A (50/50 R/U): SQLite 157.0K (h=88, y=347), aydb 95.2K (h=53, y=382) -->
  <rect x="552" y="347" width="20" height="88" rx="2" fill="url(#sqliteBar)"/>
  <rect x="576" y="382" width="20" height="53" rx="2" fill="url(#aydbBar)"/>
  <text x="586" y="372" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">95K</text>
  <text x="574" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="574" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 R/U</text>
  <text x="574" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.61x</text>

  <!-- Workload B (95/5 R/U): SQLite 186.7K (h=105, y=330), aydb 269.1K (h=151, y=284) -->
  <rect x="615" y="330" width="20" height="105" rx="2" fill="url(#sqliteBar)"/>
  <rect x="639" y="284" width="20" height="151" rx="2" fill="url(#aydbBar)"/>
  <text x="649" y="274" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">269K</text>
  <text x="637" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="637" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">95/5 R/U</text>
  <text x="637" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.44x</text>

  <!-- Workload C (100% Read): SQLite 199.3K (h=112, y=323), aydb 443.6K (h=248, y=187) -->
  <rect x="678" y="323" width="20" height="112" rx="2" fill="url(#sqliteBar)"/>
  <rect x="702" y="187" width="20" height="248" rx="2" fill="url(#aydbBar)"/>
  <text x="712" y="177" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">444K</text>
  <text x="700" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="700" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">100% Read</text>
  <text x="700" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">2.23x</text>

  <!-- Workload D (Read Latest): SQLite 101.8K (h=57, y=378), aydb 278.2K (h=156, y=279) -->
  <rect x="741" y="378" width="20" height="57" rx="2" fill="url(#sqliteBar)"/>
  <rect x="765" y="279" width="20" height="156" rx="2" fill="url(#aydbBar)"/>
  <text x="775" y="269" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">278K</text>
  <text x="763" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">D</text>
  <text x="763" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Latest</text>
  <text x="763" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">2.73x</text>

  <!-- Workload E (Short Range): SQLite 44.5K (h=25, y=410), aydb 22.2K (h=12, y=423) -->
  <rect x="804" y="410" width="20" height="25" rx="2" fill="url(#sqliteBar)"/>
  <rect x="828" y="423" width="20" height="12" rx="2" fill="url(#aydbBar)"/>
  <text x="838" y="413" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">22K</text>
  <text x="826" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="826" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Range(10)</text>
  <text x="826" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.50x</text>

  <!-- Workload F (50/50 RMW): SQLite 124.3K (h=70, y=365), aydb 88.9K (h=50, y=385) -->
  <rect x="867" y="365" width="20" height="70" rx="2" fill="url(#sqliteBar)"/>
  <rect x="891" y="385" width="20" height="50" rx="2" fill="url(#aydbBar)"/>
  <text x="901" y="375" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">89K</text>
  <text x="889" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">F</text>
  <text x="889" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 RMW</text>
  <text x="889" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.72x</text>
</svg>
