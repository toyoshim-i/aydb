<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="aydbBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sqliteBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="12" fill="#0f172a"/>
  <rect x="1" y="1" width="958" height="518" rx="11" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">YCSB-Style Workloads A–F Throughput Comparison (Zipfian θ = 0.99)</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Throughput in thousand ops/sec (kops/s, Higher is better) — Left: 256 B Inline | Right: 2,048 B WiscKey Blob</text>

  <!-- Dedicated Legend Row (y = 78..92, generous spacing) -->
  <rect x="32" y="78" width="14" height="14" rx="3" fill="url(#sqliteBar)"/>
  <text x="52" y="90" fill="#cbd5e1" font-size="12" font-weight="600">Vanilla SQLite (WAL Mode, NORMAL)</text>
  <rect x="340" y="78" width="14" height="14" rx="3" fill="url(#aydbBar)"/>
  <text x="360" y="90" fill="#38bdf8" font-size="12" font-weight="700">aydb Virtual Table (Buffered Dual-Stream WAL)</text>

  <!-- ==================== LEFT PANEL: 256 B Inline (Max = 1,300 kops/s, height = 280px, y: 155..435) ==================== -->
  <text x="260" y="126" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">256 B Inline Records (kops/s)</text>

  <!-- Left Gridlines: 0 (435), 325 (365), 650 (295), 975 (225), 1300 (155) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="70" y1="435" x2="455" y2="435" stroke="#475569"/>
    <line x1="70" y1="365" x2="455" y2="365"/>
    <line x1="70" y1="295" x2="455" y2="295"/>
    <line x1="70" y1="225" x2="455" y2="225"/>
    <line x1="70" y1="155" x2="455" y2="155"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="62" y="439">0</text>
    <text x="62" y="369">325K</text>
    <text x="62" y="299">650K</text>
    <text x="62" y="229">975K</text>
    <text x="62" y="159">1,300K</text>
  </g>

  <!-- Scale for Left Panel: h = val_kops * (280 / 1300) = val_kops * 0.21538 -->
  <!-- Workload A (50/50 R/U): SQLite 159.4K (h=34, y=401), aydb 294.4K (h=63, y=372) -->
  <rect x="82" y="401" width="20" height="34" rx="2" fill="url(#sqliteBar)"/>
  <rect x="106" y="372" width="20" height="63" rx="2" fill="url(#aydbBar)"/>
  <text x="116" y="362" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">294K</text>
  <text x="104" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="104" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 R/U</text>
  <text x="104" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.85x</text>

  <!-- Workload B (95/5 R/U): SQLite 267.2K (h=58, y=377), aydb 895.3K (h=193, y=242) -->
  <rect x="145" y="377" width="20" height="58" rx="2" fill="url(#sqliteBar)"/>
  <rect x="169" y="242" width="20" height="193" rx="2" fill="url(#aydbBar)"/>
  <text x="179" y="232" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">895K</text>
  <text x="167" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="167" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">95/5 R/U</text>
  <text x="167" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">3.35x</text>

  <!-- Workload C (100% Read): SQLite 284.7K (h=61, y=374), aydb 1248.3K (h=269, y=166) -->
  <rect x="208" y="374" width="20" height="61" rx="2" fill="url(#sqliteBar)"/>
  <rect x="232" y="166" width="20" height="269" rx="2" fill="url(#aydbBar)"/>
  <text x="242" y="156" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">1,248K</text>
  <text x="230" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="230" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">100% Read</text>
  <text x="230" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">4.38x</text>

  <!-- Workload D (Read Latest): SQLite 221.1K (h=48, y=387), aydb 928.1K (h=200, y=235) -->
  <rect x="271" y="387" width="20" height="48" rx="2" fill="url(#sqliteBar)"/>
  <rect x="295" y="235" width="20" height="200" rx="2" fill="url(#aydbBar)"/>
  <text x="305" y="225" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">928K</text>
  <text x="293" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">D</text>
  <text x="293" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Latest</text>
  <text x="293" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">4.20x</text>

  <!-- Workload E (Short Range): SQLite 104.4K (h=22, y=413), aydb 265.8K (h=57, y=378) -->
  <rect x="334" y="413" width="20" height="22" rx="2" fill="url(#sqliteBar)"/>
  <rect x="358" y="378" width="20" height="57" rx="2" fill="url(#aydbBar)"/>
  <text x="368" y="368" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">266K</text>
  <text x="356" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="356" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Range(10)</text>
  <text x="356" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">2.55x</text>

  <!-- Workload F (50/50 RMW): SQLite 166.3K (h=36, y=399), aydb 253.2K (h=55, y=380) -->
  <rect x="397" y="399" width="20" height="36" rx="2" fill="url(#sqliteBar)"/>
  <rect x="421" y="380" width="20" height="55" rx="2" fill="url(#aydbBar)"/>
  <text x="431" y="370" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">253K</text>
  <text x="419" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">F</text>
  <text x="419" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 RMW</text>
  <text x="419" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.52x</text>

  <!-- ==================== RIGHT PANEL: 2,048 B WiscKey Separated (Max = 220 kops/s, height = 280px, y: 155..435) ==================== -->
  <text x="735" y="126" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">2,048 B WiscKey Blob Records (kops/s)</text>

  <!-- Right Gridlines: 0 (435), 55 (365), 110 (295), 165 (225), 220 (155) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="540" y1="435" x2="925" y2="435" stroke="#475569"/>
    <line x1="540" y1="365" x2="925" y2="365"/>
    <line x1="540" y1="295" x2="925" y2="295"/>
    <line x1="540" y1="225" x2="925" y2="225"/>
    <line x1="540" y1="155" x2="925" y2="155"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="532" y="439">0</text>
    <text x="532" y="369">55K</text>
    <text x="532" y="299">110K</text>
    <text x="532" y="229">165K</text>
    <text x="532" y="159">220K</text>
  </g>

  <!-- Scale for Right Panel: h = val_kops * (280 / 220) = val_kops * 1.2727 -->
  <!-- Workload A (50/50 R/U): SQLite 151.1K (h=192, y=243), aydb 81.9K (h=104, y=331) -->
  <rect x="552" y="243" width="20" height="192" rx="2" fill="url(#sqliteBar)"/>
  <rect x="576" y="331" width="20" height="104" rx="2" fill="url(#aydbBar)"/>
  <text x="586" y="321" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">82K</text>
  <text x="574" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="574" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 R/U</text>
  <text x="574" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.54x</text>

  <!-- Workload B (95/5 R/U): SQLite 179.5K (h=228, y=207), aydb 159.9K (h=204, y=231) -->
  <rect x="615" y="207" width="20" height="228" rx="2" fill="url(#sqliteBar)"/>
  <rect x="639" y="231" width="20" height="204" rx="2" fill="url(#aydbBar)"/>
  <text x="649" y="221" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">160K</text>
  <text x="637" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="637" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">95/5 R/U</text>
  <text x="637" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.89x</text>

  <!-- Workload C (100% Read): SQLite 200.8K (h=256, y=179), aydb 186.6K (h=238, y=197) -->
  <rect x="678" y="179" width="20" height="256" rx="2" fill="url(#sqliteBar)"/>
  <rect x="702" y="197" width="20" height="238" rx="2" fill="url(#aydbBar)"/>
  <text x="712" y="187" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">187K</text>
  <text x="700" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="700" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">100% Read</text>
  <text x="700" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.93x</text>

  <!-- Workload D (Read Latest): SQLite 103.1K (h=131, y=304), aydb 174.7K (h=222, y=213) -->
  <rect x="741" y="304" width="20" height="131" rx="2" fill="url(#sqliteBar)"/>
  <rect x="765" y="213" width="20" height="222" rx="2" fill="url(#aydbBar)"/>
  <text x="775" y="203" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">175K</text>
  <text x="763" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">D</text>
  <text x="763" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Latest</text>
  <text x="763" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.69x</text>

  <!-- Workload E (Short Range): SQLite 42.3K (h=54, y=381), aydb 24.0K (h=31, y=404) -->
  <rect x="804" y="381" width="20" height="54" rx="2" fill="url(#sqliteBar)"/>
  <rect x="828" y="404" width="20" height="31" rx="2" fill="url(#aydbBar)"/>
  <text x="838" y="372" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">24K</text>
  <text x="826" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="826" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Range(10)</text>
  <text x="826" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.57x</text>

  <!-- Workload F (50/50 RMW): SQLite 122.8K (h=156, y=279), aydb 70.5K (h=90, y=345) -->
  <rect x="867" y="279" width="20" height="156" rx="2" fill="url(#sqliteBar)"/>
  <rect x="891" y="345" width="20" height="90" rx="2" fill="url(#aydbBar)"/>
  <text x="901" y="335" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">71K</text>
  <text x="889" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">F</text>
  <text x="889" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 RMW</text>
  <text x="889" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.57x</text>
</svg>
