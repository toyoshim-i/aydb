<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="aydbBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sqliteBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="12" fill="#0f172a"/>
  <rect x="1" y="1" width="958" height="518" rx="11" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">YCSB-Style Workloads A–F Throughput Comparison (Zipfian θ = 0.99)</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Throughput in thousand ops/sec (kops/s, Higher is better) — Left: 256 B Inline | Right: 2,048 B WiscKey Blob</text>

  <!-- Dedicated Legend Row (y = 78..92, generous spacing) -->
  <rect x="32" y="78" width="14" height="14" rx="3" fill="url(#sqliteBar)"/>
  <text x="52" y="90" fill="#cbd5e1" font-size="12" font-weight="600">Vanilla SQLite (WAL Mode, NORMAL)</text>
  <rect x="340" y="78" width="14" height="14" rx="3" fill="url(#aydbBar)"/>
  <text x="360" y="90" fill="#38bdf8" font-size="12" font-weight="700">aydb Virtual Table (Buffered Dual-Stream WAL)</text>

  <!-- ==================== LEFT PANEL: 256 B Inline (Max = 1,300 kops/s, height = 280px, y: 155..435) ==================== -->
  <text x="260" y="126" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">256 B Inline Records (kops/s)</text>

  <!-- Left Gridlines: 0 (435), 325 (365), 650 (295), 975 (225), 1300 (155) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="70" y1="435" x2="455" y2="435" stroke="#475569"/>
    <line x1="70" y1="365" x2="455" y2="365"/>
    <line x1="70" y1="295" x2="455" y2="295"/>
    <line x1="70" y1="225" x2="455" y2="225"/>
    <line x1="70" y1="155" x2="455" y2="155"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="62" y="439">0</text>
    <text x="62" y="369">325K</text>
    <text x="62" y="299">650K</text>
    <text x="62" y="229">975K</text>
    <text x="62" y="159">1,300K</text>
  </g>

  <!-- Scale for Left Panel: h = val_kops * (280 / 1300) = val_kops * 0.21538 -->
  <!-- Workload A (50/50 R/U): SQLite 230.6K (h=50, y=385), aydb 284.8K (h=61, y=374) -->
  <rect x="82" y="385" width="20" height="50" rx="2" fill="url(#sqliteBar)"/>
  <rect x="106" y="374" width="20" height="61" rx="2" fill="url(#aydbBar)"/>
  <text x="116" y="364" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">285K</text>
  <text x="104" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="104" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 R/U</text>
  <text x="104" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.23x</text>

  <!-- Workload B (95/5 R/U): SQLite 286.3K (h=62, y=373), aydb 847.8K (h=183, y=252) -->
  <rect x="145" y="373" width="20" height="62" rx="2" fill="url(#sqliteBar)"/>
  <rect x="169" y="252" width="20" height="183" rx="2" fill="url(#aydbBar)"/>
  <text x="179" y="242" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">848K</text>
  <text x="167" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="167" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">95/5 R/U</text>
  <text x="167" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">2.96x</text>

  <!-- Workload C (100% Read): SQLite 297.6K (h=64, y=371), aydb 1169.3K (h=252, y=183) -->
  <rect x="208" y="371" width="20" height="64" rx="2" fill="url(#sqliteBar)"/>
  <rect x="232" y="183" width="20" height="252" rx="2" fill="url(#aydbBar)"/>
  <text x="242" y="173" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">1,169K</text>
  <text x="230" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="230" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">100% Read</text>
  <text x="230" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">3.93x</text>

  <!-- Workload D (Read Latest): SQLite 210.6K (h=45, y=390), aydb 814.9K (h=176, y=259) -->
  <rect x="271" y="390" width="20" height="45" rx="2" fill="url(#sqliteBar)"/>
  <rect x="295" y="259" width="20" height="176" rx="2" fill="url(#aydbBar)"/>
  <text x="305" y="249" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">815K</text>
  <text x="293" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">D</text>
  <text x="293" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Latest</text>
  <text x="293" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">3.87x</text>

  <!-- Workload E (Short Range): SQLite 112.7K (h=24, y=411), aydb 52.3K (h=11, y=424) -->
  <rect x="334" y="411" width="20" height="24" rx="2" fill="url(#sqliteBar)"/>
  <rect x="358" y="424" width="20" height="11" rx="2" fill="url(#aydbBar)"/>
  <text x="368" y="401" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">52K</text>
  <text x="356" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="356" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Range(10)</text>
  <text x="356" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.46x</text>

  <!-- Workload F (50/50 RMW): SQLite 167.8K (h=36, y=399), aydb 252.9K (h=54, y=381) -->
  <rect x="397" y="399" width="20" height="36" rx="2" fill="url(#sqliteBar)"/>
  <rect x="421" y="381" width="20" height="54" rx="2" fill="url(#aydbBar)"/>
  <text x="431" y="371" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">253K</text>
  <text x="419" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">F</text>
  <text x="419" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 RMW</text>
  <text x="419" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.51x</text>

  <!-- ==================== RIGHT PANEL: 2,048 B WiscKey Separated (Max = 220 kops/s, height = 280px, y: 155..435) ==================== -->
  <text x="735" y="126" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">2,048 B WiscKey Blob Records (kops/s)</text>

  <!-- Right Gridlines: 0 (435), 55 (365), 110 (295), 165 (225), 220 (155) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="540" y1="435" x2="925" y2="435" stroke="#475569"/>
    <line x1="540" y1="365" x2="925" y2="365"/>
    <line x1="540" y1="295" x2="925" y2="295"/>
    <line x1="540" y1="225" x2="925" y2="225"/>
    <line x1="540" y1="155" x2="925" y2="155"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="532" y="439">0</text>
    <text x="532" y="369">55K</text>
    <text x="532" y="299">110K</text>
    <text x="532" y="229">165K</text>
    <text x="532" y="159">220K</text>
  </g>

  <!-- Scale for Right Panel: h = val_kops * (280 / 220) = val_kops * 1.2727 -->
  <!-- Workload A (50/50 R/U): SQLite 148.8K (h=189, y=246), aydb 84.1K (h=107, y=328) -->
  <rect x="552" y="246" width="20" height="189" rx="2" fill="url(#sqliteBar)"/>
  <rect x="576" y="328" width="20" height="107" rx="2" fill="url(#aydbBar)"/>
  <text x="586" y="318" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">84K</text>
  <text x="574" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="574" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 R/U</text>
  <text x="574" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.57x</text>

  <!-- Workload B (95/5 R/U): SQLite 181.5K (h=231, y=204), aydb 155.8K (h=198, y=237) -->
  <rect x="615" y="204" width="20" height="231" rx="2" fill="url(#sqliteBar)"/>
  <rect x="639" y="237" width="20" height="198" rx="2" fill="url(#aydbBar)"/>
  <text x="649" y="227" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">156K</text>
  <text x="637" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="637" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">95/5 R/U</text>
  <text x="637" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.86x</text>

  <!-- Workload C (100% Read): SQLite 188.8K (h=240, y=195), aydb 180.9K (h=230, y=205) -->
  <rect x="678" y="195" width="20" height="240" rx="2" fill="url(#sqliteBar)"/>
  <rect x="702" y="205" width="20" height="230" rx="2" fill="url(#aydbBar)"/>
  <text x="712" y="195" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">181K</text>
  <text x="700" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="700" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">100% Read</text>
  <text x="700" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.96x</text>

  <!-- Workload D (Read Latest): SQLite 117.5K (h=150, y=285), aydb 168.3K (h=214, y=221) -->
  <rect x="741" y="285" width="20" height="150" rx="2" fill="url(#sqliteBar)"/>
  <rect x="765" y="221" width="20" height="214" rx="2" fill="url(#aydbBar)"/>
  <text x="775" y="211" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">168K</text>
  <text x="763" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">D</text>
  <text x="763" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Latest</text>
  <text x="763" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.43x</text>

  <!-- Workload E (Short Range): SQLite 45.5K (h=58, y=377), aydb 0.67K (h=3, y=432) -->
  <rect x="804" y="377" width="20" height="58" rx="2" fill="url(#sqliteBar)"/>
  <rect x="828" y="432" width="20" height="3" rx="1" fill="url(#aydbBar)"/>
  <text x="838" y="422" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">0.7K</text>
  <text x="826" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="826" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Range(10)</text>
  <text x="826" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.01x</text>

  <!-- Workload F (50/50 RMW): SQLite 127.4K (h=162, y=273), aydb 68.0K (h=87, y=348) -->
  <rect x="867" y="273" width="20" height="162" rx="2" fill="url(#sqliteBar)"/>
  <rect x="891" y="348" width="20" height="87" rx="2" fill="url(#aydbBar)"/>
  <text x="901" y="338" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">68K</text>
  <text x="889" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">F</text>
  <text x="889" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 RMW</text>
  <text x="889" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.53x</text>
</svg>
