<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="aydbBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sqliteBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="12" fill="#0f172a"/>
  <rect x="1" y="1" width="958" height="518" rx="11" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">YCSB-Style Workloads A–F Throughput Comparison (Zipfian θ = 0.99)</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Throughput in thousand ops/sec (kops/s, Higher is better) — Left: 256 B Inline | Right: 2,048 B WiscKey Blob</text>

  <!-- Dedicated Legend Row (y = 78..92, generous spacing) -->
  <rect x="32" y="78" width="14" height="14" rx="3" fill="url(#sqliteBar)"/>
  <text x="52" y="90" fill="#cbd5e1" font-size="12" font-weight="600">Vanilla SQLite (WAL Mode, NORMAL)</text>
  <rect x="340" y="78" width="14" height="14" rx="3" fill="url(#aydbBar)"/>
  <text x="360" y="90" fill="#38bdf8" font-size="12" font-weight="700">aydb Virtual Table (Buffered Dual-Stream WAL)</text>

  <!-- ==================== LEFT PANEL: 256 B Inline (Max = 1,300 kops/s, height = 280px, y: 155..435) ==================== -->
  <text x="260" y="126" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">256 B Inline Records (kops/s)</text>

  <!-- Left Gridlines: 0 (435), 325 (365), 650 (295), 975 (225), 1300 (155) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="70" y1="435" x2="455" y2="435" stroke="#475569"/>
    <line x1="70" y1="365" x2="455" y2="365"/>
    <line x1="70" y1="295" x2="455" y2="295"/>
    <line x1="70" y1="225" x2="455" y2="225"/>
    <line x1="70" y1="155" x2="455" y2="155"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="62" y="439">0</text>
    <text x="62" y="369">325K</text>
    <text x="62" y="299">650K</text>
    <text x="62" y="229">975K</text>
    <text x="62" y="159">1,300K</text>
  </g>

  <!-- Scale for Left Panel: h = val_kops * (280 / 1300) = val_kops * 0.21538 -->
  <!-- Workload A (50/50 R/U): SQLite 220.9K (h=48, y=387), aydb 298.8K (h=64, y=371) -->
  <rect x="82" y="387" width="20" height="48" rx="2" fill="url(#sqliteBar)"/>
  <rect x="106" y="371" width="20" height="64" rx="2" fill="url(#aydbBar)"/>
  <text x="116" y="361" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">299K</text>
  <text x="104" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="104" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 R/U</text>
  <text x="104" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.35x</text>

  <!-- Workload B (95/5 R/U): SQLite 291.1K (h=63, y=372), aydb 886.5K (h=191, y=244) -->
  <rect x="145" y="372" width="20" height="63" rx="2" fill="url(#sqliteBar)"/>
  <rect x="169" y="244" width="20" height="191" rx="2" fill="url(#aydbBar)"/>
  <text x="179" y="234" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">887K</text>
  <text x="167" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="167" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">95/5 R/U</text>
  <text x="167" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">3.05x</text>

  <!-- Workload C (100% Read): SQLite 303.3K (h=65, y=370), aydb 1207.8K (h=260, y=175) -->
  <rect x="208" y="370" width="20" height="65" rx="2" fill="url(#sqliteBar)"/>
  <rect x="232" y="175" width="20" height="260" rx="2" fill="url(#aydbBar)"/>
  <text x="242" y="165" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">1,208K</text>
  <text x="230" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="230" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">100% Read</text>
  <text x="230" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">3.98x</text>

  <!-- Workload D (Read Latest): SQLite 205.8K (h=44, y=391), aydb 889.6K (h=192, y=243) -->
  <rect x="271" y="391" width="20" height="44" rx="2" fill="url(#sqliteBar)"/>
  <rect x="295" y="243" width="20" height="192" rx="2" fill="url(#aydbBar)"/>
  <text x="305" y="233" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">890K</text>
  <text x="293" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">D</text>
  <text x="293" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Latest</text>
  <text x="293" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">4.32x</text>

  <!-- Workload E (Short Range): SQLite 107.3K (h=23, y=412), aydb 105.3K (h=23, y=412) -->
  <rect x="334" y="412" width="20" height="23" rx="2" fill="url(#sqliteBar)"/>
  <rect x="358" y="412" width="20" height="23" rx="2" fill="url(#aydbBar)"/>
  <text x="368" y="402" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">105K</text>
  <text x="356" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="356" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Range(10)</text>
  <text x="356" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.98x</text>

  <!-- Workload F (50/50 RMW): SQLite 176.2K (h=38, y=397), aydb 264.3K (h=57, y=378) -->
  <rect x="397" y="397" width="20" height="38" rx="2" fill="url(#sqliteBar)"/>
  <rect x="421" y="378" width="20" height="57" rx="2" fill="url(#aydbBar)"/>
  <text x="431" y="368" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">264K</text>
  <text x="419" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">F</text>
  <text x="419" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 RMW</text>
  <text x="419" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.50x</text>

  <!-- ==================== RIGHT PANEL: 2,048 B WiscKey Separated (Max = 220 kops/s, height = 280px, y: 155..435) ==================== -->
  <text x="735" y="126" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">2,048 B WiscKey Blob Records (kops/s)</text>

  <!-- Right Gridlines: 0 (435), 55 (365), 110 (295), 165 (225), 220 (155) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="540" y1="435" x2="925" y2="435" stroke="#475569"/>
    <line x1="540" y1="365" x2="925" y2="365"/>
    <line x1="540" y1="295" x2="925" y2="295"/>
    <line x1="540" y1="225" x2="925" y2="225"/>
    <line x1="540" y1="155" x2="925" y2="155"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="532" y="439">0</text>
    <text x="532" y="369">55K</text>
    <text x="532" y="299">110K</text>
    <text x="532" y="229">165K</text>
    <text x="532" y="159">220K</text>
  </g>

  <!-- Scale for Right Panel: h = val_kops * (280 / 220) = val_kops * 1.2727 -->
  <!-- Workload A (50/50 R/U): SQLite 155.0K (h=197, y=238), aydb 85.9K (h=109, y=326) -->
  <rect x="552" y="238" width="20" height="197" rx="2" fill="url(#sqliteBar)"/>
  <rect x="576" y="326" width="20" height="109" rx="2" fill="url(#aydbBar)"/>
  <text x="586" y="316" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">86K</text>
  <text x="574" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="574" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 R/U</text>
  <text x="574" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.55x</text>

  <!-- Workload B (95/5 R/U): SQLite 184.1K (h=234, y=201), aydb 153.5K (h=195, y=240) -->
  <rect x="615" y="201" width="20" height="234" rx="2" fill="url(#sqliteBar)"/>
  <rect x="639" y="240" width="20" height="195" rx="2" fill="url(#aydbBar)"/>
  <text x="649" y="230" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">153K</text>
  <text x="637" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="637" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">95/5 R/U</text>
  <text x="637" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.83x</text>

  <!-- Workload C (100% Read): SQLite 191.6K (h=244, y=191), aydb 187.9K (h=239, y=196) -->
  <rect x="678" y="191" width="20" height="244" rx="2" fill="url(#sqliteBar)"/>
  <rect x="702" y="196" width="20" height="239" rx="2" fill="url(#aydbBar)"/>
  <text x="712" y="186" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">188K</text>
  <text x="700" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="700" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">100% Read</text>
  <text x="700" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.98x</text>

  <!-- Workload D (Read Latest): SQLite 104.6K (h=133, y=302), aydb 167.0K (h=213, y=222) -->
  <rect x="741" y="302" width="20" height="133" rx="2" fill="url(#sqliteBar)"/>
  <rect x="765" y="222" width="20" height="213" rx="2" fill="url(#aydbBar)"/>
  <text x="775" y="212" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">167K</text>
  <text x="763" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">D</text>
  <text x="763" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Latest</text>
  <text x="763" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.60x</text>

  <!-- Workload E (Short Range): SQLite 42.8K (h=55, y=380), aydb 17.1K (h=22, y=413) -->
  <rect x="804" y="380" width="20" height="55" rx="2" fill="url(#sqliteBar)"/>
  <rect x="828" y="413" width="20" height="22" rx="2" fill="url(#aydbBar)"/>
  <text x="838" y="403" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">17K</text>
  <text x="826" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="826" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Range(10)</text>
  <text x="826" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.39x</text>

  <!-- Workload F (50/50 RMW): SQLite 120.9K (h=154, y=281), aydb 70.0K (h=89, y=346) -->
  <rect x="867" y="281" width="20" height="154" rx="2" fill="url(#sqliteBar)"/>
  <rect x="891" y="346" width="20" height="89" rx="2" fill="url(#aydbBar)"/>
  <text x="901" y="336" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">70K</text>
  <text x="889" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">F</text>
  <text x="889" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 RMW</text>
  <text x="889" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.58x</text>
</svg>
