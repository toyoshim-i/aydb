<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="aydbBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sqliteBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="12" fill="#0f172a"/>
  <rect x="1" y="1" width="958" height="518" rx="11" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">YCSB Workloads A–F Throughput Comparison (Zipfian θ = 0.99)</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Throughput in thousand ops/sec (kops/s, Higher is better) — Left: 256 B Inline | Right: 2,048 B WiscKey Blob</text>

  <!-- Dedicated Legend Row (y = 78..92, generous spacing) -->
  <rect x="32" y="78" width="14" height="14" rx="3" fill="url(#sqliteBar)"/>
  <text x="52" y="90" fill="#cbd5e1" font-size="12" font-weight="600">Vanilla SQLite (WAL Mode, NORMAL)</text>
  <rect x="340" y="78" width="14" height="14" rx="3" fill="url(#aydbBar)"/>
  <text x="360" y="90" fill="#38bdf8" font-size="12" font-weight="700">aydb Virtual Table (Buffered Dual-Stream WAL)</text>

  <!-- ==================== LEFT PANEL: 256 B Inline (Max = 1,300 kops/s, height = 280px, y: 155..435) ==================== -->
  <text x="260" y="126" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">256 B Inline Records (kops/s)</text>

  <!-- Left Gridlines: 0 (435), 325 (365), 650 (295), 975 (225), 1300 (155) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="70" y1="435" x2="455" y2="435" stroke="#475569"/>
    <line x1="70" y1="365" x2="455" y2="365"/>
    <line x1="70" y1="295" x2="455" y2="295"/>
    <line x1="70" y1="225" x2="455" y2="225"/>
    <line x1="70" y1="155" x2="455" y2="155"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="62" y="439">0</text>
    <text x="62" y="369">325K</text>
    <text x="62" y="299">650K</text>
    <text x="62" y="229">975K</text>
    <text x="62" y="159">1,300K</text>
  </g>

  <!-- Scale for Left Panel: h = val_kops * (280 / 1300) = val_kops * 0.21538 -->
  <!-- Workload A (50/50 R/U): SQLite 30.5K (h=7, y=428), aydb 323.3K (h=70, y=365) -->
  <rect x="82" y="428" width="20" height="7" rx="2" fill="url(#sqliteBar)"/>
  <rect x="106" y="365" width="20" height="70" rx="2" fill="url(#aydbBar)"/>
  <text x="116" y="355" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">323K</text>
  <text x="104" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="104" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 R/U</text>
  <text x="104" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">10.6x</text>

  <!-- Workload B (95/5 R/U): SQLite 212.5K (h=46, y=389), aydb 902.0K (h=194, y=241) -->
  <rect x="145" y="389" width="20" height="46" rx="2" fill="url(#sqliteBar)"/>
  <rect x="169" y="241" width="20" height="194" rx="2" fill="url(#aydbBar)"/>
  <text x="179" y="231" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">902K</text>
  <text x="167" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="167" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">95/5 R/U</text>
  <text x="167" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">4.24x</text>

  <!-- Workload C (100% Read): SQLite 286.4K (h=62, y=373), aydb 1233.7K (h=266, y=169) -->
  <rect x="208" y="373" width="20" height="62" rx="2" fill="url(#sqliteBar)"/>
  <rect x="232" y="169" width="20" height="266" rx="2" fill="url(#aydbBar)"/>
  <text x="242" y="159" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">1,234K</text>
  <text x="230" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="230" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">100% Read</text>
  <text x="230" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">4.31x</text>

  <!-- Workload D (Read Latest): SQLite 147.4K (h=32, y=403), aydb 848.0K (h=183, y=252) -->
  <rect x="271" y="403" width="20" height="32" rx="2" fill="url(#sqliteBar)"/>
  <rect x="295" y="252" width="20" height="183" rx="2" fill="url(#aydbBar)"/>
  <text x="305" y="242" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">848K</text>
  <text x="293" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">D</text>
  <text x="293" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Latest</text>
  <text x="293" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">5.75x</text>

  <!-- Workload E (Short Range): SQLite 106.3K (h=23, y=412), aydb 254.9K (h=55, y=380) -->
  <rect x="334" y="412" width="20" height="23" rx="2" fill="url(#sqliteBar)"/>
  <rect x="358" y="380" width="20" height="55" rx="2" fill="url(#aydbBar)"/>
  <text x="368" y="370" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">255K</text>
  <text x="356" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="356" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Range(10)</text>
  <text x="356" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">2.40x</text>

  <!-- Workload F (50/50 RMW): SQLite 28.5K (h=6, y=429), aydb 294.5K (h=63, y=372) -->
  <rect x="397" y="429" width="20" height="6" rx="2" fill="url(#sqliteBar)"/>
  <rect x="421" y="372" width="20" height="63" rx="2" fill="url(#aydbBar)"/>
  <text x="431" y="362" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">294K</text>
  <text x="419" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">F</text>
  <text x="419" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 RMW</text>
  <text x="419" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">10.4x</text>

  <!-- ==================== RIGHT PANEL: 2,048 B WiscKey Separated (Max = 220 kops/s, height = 280px, y: 155..435) ==================== -->
  <text x="735" y="126" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">2,048 B WiscKey Blob Records (kops/s)</text>

  <!-- Right Gridlines: 0 (435), 55 (365), 110 (295), 165 (225), 220 (155) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="540" y1="435" x2="925" y2="435" stroke="#475569"/>
    <line x1="540" y1="365" x2="925" y2="365"/>
    <line x1="540" y1="295" x2="925" y2="295"/>
    <line x1="540" y1="225" x2="925" y2="225"/>
    <line x1="540" y1="155" x2="925" y2="155"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="532" y="439">0</text>
    <text x="532" y="369">55K</text>
    <text x="532" y="299">110K</text>
    <text x="532" y="229">165K</text>
    <text x="532" y="159">220K</text>
  </g>

  <!-- Scale for Right Panel: h = val_kops * (280 / 220) = val_kops * 1.2727 -->
  <!-- Workload A (50/50 R/U): SQLite 13.3K (h=17, y=418), aydb 107.6K (h=137, y=298) -->
  <rect x="552" y="418" width="20" height="17" rx="2" fill="url(#sqliteBar)"/>
  <rect x="576" y="298" width="20" height="137" rx="2" fill="url(#aydbBar)"/>
  <text x="586" y="288" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">108K</text>
  <text x="574" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="574" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 R/U</text>
  <text x="574" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">8.10x</text>

  <!-- Workload B (95/5 R/U): SQLite 93.2K (h=119, y=316), aydb 172.1K (h=219, y=216) -->
  <rect x="615" y="316" width="20" height="119" rx="2" fill="url(#sqliteBar)"/>
  <rect x="639" y="216" width="20" height="219" rx="2" fill="url(#aydbBar)"/>
  <text x="649" y="206" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">172K</text>
  <text x="637" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="637" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">95/5 R/U</text>
  <text x="637" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">1.85x</text>

  <!-- Workload C (100% Read): SQLite 195.6K (h=249, y=186), aydb 190.7K (h=243, y=192) -->
  <rect x="678" y="186" width="20" height="249" rx="2" fill="url(#sqliteBar)"/>
  <rect x="702" y="192" width="20" height="243" rx="2" fill="url(#aydbBar)"/>
  <text x="712" y="176" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">191K</text>
  <text x="700" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C</text>
  <text x="700" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">100% Read</text>
  <text x="700" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.98x</text>

  <!-- Workload D (Read Latest): SQLite 88.2K (h=112, y=323), aydb 177.8K (h=226, y=209) -->
  <rect x="741" y="323" width="20" height="112" rx="2" fill="url(#sqliteBar)"/>
  <rect x="765" y="209" width="20" height="226" rx="2" fill="url(#aydbBar)"/>
  <text x="775" y="199" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">178K</text>
  <text x="763" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">D</text>
  <text x="763" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Latest</text>
  <text x="763" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">2.02x</text>

  <!-- Workload E (Short Range): SQLite 32.7K (h=42, y=393), aydb 23.1K (h=29, y=406) -->
  <rect x="804" y="393" width="20" height="42" rx="2" fill="url(#sqliteBar)"/>
  <rect x="828" y="406" width="20" height="29" rx="2" fill="url(#aydbBar)"/>
  <text x="838" y="384" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">23K</text>
  <text x="826" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="826" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">Range(10)</text>
  <text x="826" y="488" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">0.71x</text>

  <!-- Workload F (50/50 RMW): SQLite 11.9K (h=15, y=420), aydb 84.8K (h=108, y=327) -->
  <rect x="867" y="420" width="20" height="15" rx="2" fill="url(#sqliteBar)"/>
  <rect x="891" y="327" width="20" height="108" rx="2" fill="url(#aydbBar)"/>
  <text x="901" y="317" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">85K</text>
  <text x="889" y="456" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">F</text>
  <text x="889" y="472" fill="#94a3b8" font-size="10" text-anchor="middle">50/50 RMW</text>
  <text x="889" y="488" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">7.10x</text>
</svg>
