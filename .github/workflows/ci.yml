name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The crate links the system SQLite: winsqlite3 on Windows (part of
      # the OS image), libsqlite3 on macOS (part of the OS), and the
      # development package on Linux.
      - name: Install libsqlite3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # Each step disables `set -e` around the pipeline so both PIPESTATUS[0]
      # (cargo) and PIPESTATUS[1] (tee) are captured without masking failures.
      - name: Prepare results directory
        run: mkdir -p results && : > results/test-status.txt

      - name: Format
        run: |
          set +e
          cargo fmt --check 2>&1 | tee results/fmt.txt
          status=${PIPESTATUS[0]}
          tee_status=${PIPESTATUS[1]}
          if [ "$status" -eq 0 ] && [ "$tee_status" -ne 0 ]; then
            status=$tee_status
          fi
          set -e
          echo "fmt exit=$status" >> results/test-status.txt
          exit "$status"

      - name: Clippy
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings 2>&1 | tee results/clippy.txt
          status=${PIPESTATUS[0]}
          tee_status=${PIPESTATUS[1]}
          if [ "$status" -eq 0 ] && [ "$tee_status" -ne 0 ]; then
            status=$tee_status
          fi
          set -e
          echo "clippy exit=$status" >> results/test-status.txt
          exit "$status"

      - name: Tests
        run: |
          set +e
          cargo test --all-targets 2>&1 | tee results/tests.txt
          status=${PIPESTATUS[0]}
          tee_status=${PIPESTATUS[1]}
          if [ "$status" -eq 0 ] && [ "$tee_status" -ne 0 ]; then
            status=$tee_status
          fi
          set -e
          echo "tests exit=$status" >> results/test-status.txt
          exit "$status"

      - name: Reliability benchmark
        run: |
          set +e
          cargo run --release --example reliability_bench 2>&1 | tee results/reliability.txt
          status=${PIPESTATUS[0]}
          tee_status=${PIPESTATUS[1]}
          if [ "$status" -eq 0 ] && [ "$tee_status" -ne 0 ]; then
            status=$tee_status
          fi
          set -e
          echo "reliability exit=$status" >> results/test-status.txt
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.os }}
          path: results/
          if-no-files-found: warn

  # Benchmarks depend on "test" only to avoid starting them for pull
  # requests that do not even build. The condition below is "not
  # cancelled" rather than "all test jobs succeeded": if the test job
  # fails on one operating system (or on all of them), the benchmarks
  # still run on every operating system, so the published results page
  # shows the partial state (for example, a red Linux test column next to
  # complete benchmark numbers) instead of nothing. A manual or
  # superseding cancellation still skips the job. Each matrix leg of
  # "bench" is independent of the others, and it does not read the
  # outcome of its own test leg.
  bench:
    name: bench (${{ matrix.os }})
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libsqlite3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # Run every benchmark even if an earlier one fails, record the
      # failures, and fail the job at the end so one panic does not
      # discard the other measurements.
      - name: Run benchmarks
        run: |
          mkdir -p results/bench
          failed=""
          for name in \
            standard_sql_bench \
            sqlite_vs_aydb_bench \
            concurrent_read_bench \
            concurrent_write_bench \
            tx_isolation_read_bench \
            compaction_latency_bench \
            pal_bench \
            meta_wal_bench \
            wisckey_bench \
            lru_engine_bench \
            auto_key_bench; do
            echo "::group::$name"
            start=$(date +%s)
            set +e
            cargo run --release --example "$name" 2>&1 | tee "results/bench/$name.txt"
            status=${PIPESTATUS[0]}
            set -e
            echo "$name exit=$status seconds=$(( $(date +%s) - start ))" | tee -a results/bench/status.txt
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::benchmarks failed:$failed"
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: results/
          if-no-files-found: warn

  # Publishes the report for pushes to main. "!cancelled()" makes the job run
  # when a test or bench job failed (so a red state is published too), while
  # skipping manual or superseding cancellations. Pull requests and manual
  # runs on other refs never deploy.
  pages:
    name: pages
    needs: [test, bench]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A newer push supersedes a deployment that is still waiting; a
    # deployment already in progress is allowed to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install site generator dependencies
        run: python -m pip install "markdown==3.7"

      # Without a name, every artifact lands in its own sub-directory.
      # Missing artifacts (for example after a cancelled job) are fine.
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Build site
        run: |
          mkdir -p artifacts
          python tools/build_site.py \
            --artifacts artifacts \
            --repo . \
            --out site \
            --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --branch main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  formal:
    name: formal (Lean 4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect formal-relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^1 HEAD | grep -Eq '^(src/(engine|vtab|wal)/|formal/lean/|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.run == 'true'

      - name: Install libsqlite3 (Linux)
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Cache Lean 4 toolchain and build outputs
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/lean/.lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lakefile.toml') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Install elan and Lean 4 toolchain
        if: steps.changes.outputs.run == 'true'
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          (cd formal/lean && lake --version)

      - name: Build Lean 4 proofs, verify axioms, and check trace fixtures
        if: steps.changes.outputs.run == 'true'
        run: |
          cd formal/lean
          lake build
          python3 -B check_axioms.py
          lake exe aydb-trace-check fixtures/*.ndjson

      - name: Export live Rust traces and verify with Lean oracle
        if: steps.changes.outputs.run == 'true'
        run: |
          trace_dir="$RUNNER_TEMP/aydb-traces"
          rm -rf "$trace_dir"
          mkdir -p "$trace_dir"
          AYDB_EXPORT_TRACES_DIR="$trace_dir" cargo test --lib export_formal_traces
          for f in \
            tx_fsm_engine_2pc_poison.ndjson \
            tx_fsm_engine_group_and_errors.ndjson \
            tx_fsm_vtab_sqlite.ndjson \
            wal_links_scenarios.ndjson \
            wal_judge_scenarios.ndjson; do
            test -s "$trace_dir/$f"
          done
          (cd formal/lean && lake exe aydb-trace-check "$trace_dir"/*.ndjson)

      - name: Verify Lean oracle rejects tampered trace
        if: steps.changes.outputs.run == 'true'
        run: |
          tamper="$RUNNER_TEMP/tampered.ndjson"
          python3 -c '
          import pathlib, sys
          src = pathlib.Path("formal/lean/fixtures/tx_fsm_engine_2pc_poison.ndjson").read_text(encoding="utf-8")
          old = "\"post\":{\"health\":\"Healthy\""
          assert old in src
          pathlib.Path(sys.argv[1]).write_text(src.replace(old, "\"post\":{\"health\":\"Poisoned\"", 1), encoding="utf-8")
          ' "$tamper"
          if (cd formal/lean && lake exe aydb-trace-check "$tamper"); then
            echo "::error::aydb-trace-check unexpectedly accepted tampered trace"
            exit 1
          fi
