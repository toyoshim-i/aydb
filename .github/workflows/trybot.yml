name: Trybot
run-name: Trybot · ${{ github.ref_name }} · seed ${{ inputs.seed_start || '4000' }} (+${{ inputs.seed_count || '100' }})

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      seed_start:
        description: First seed for the additional crash tests
        required: true
        type: string
        default: '4000'
      seed_count:
        description: Number of consecutive seeds per crash mode
        required: true
        type: choice
        default: '1000'
        options: ['1', '100', '1000', '5000']

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      SEED_START: ${{ inputs.seed_start || '4000' }}
      SEED_COUNT: ${{ inputs.seed_count || '100' }}
    steps:
      - name: Validate seed range
        run: |
          export LC_ALL=C
          if [[ ! "$SEED_START" =~ ^[0-9]{1,20}$ ]]; then
            echo "First seed must be an unsigned decimal integer" >&2
            exit 1
          fi
          case "$SEED_COUNT" in
            1) limit="18446744073709551614" ;;
            100) limit="18446744073709551515" ;;
            1000) limit="18446744073709550615" ;;
            5000) limit="18446744073709546615" ;;
            *)
              echo "Invalid seed count" >&2
              exit 1
              ;;
          esac
          trimmed="${SEED_START#"${SEED_START%%[!0]*}"}"
          if [[ -z "$trimmed" ]]; then
            trimmed="0"
          fi
          printf -v padded_start "%020s" "$trimmed"
          padded_start="${padded_start// /0}"
          printf -v padded_limit "%020s" "$limit"
          padded_limit="${padded_limit// /0}"
          if [[ "$padded_start" > "$padded_limit" ]]; then
            echo "Invalid seed range" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SQLite development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Regression tests
        run: cargo test --all-targets 2>&1 | tee regression.log

      - name: Additional crash tests
        env:
          AYDB_CRASH_SEED_START: ${{ inputs.seed_start || '4000' }}
          AYDB_CRASH_SEEDS: ${{ inputs.seed_count || '100' }}
        run: |
          if [[ "$AYDB_CRASH_SEEDS" == 1 ]]; then
            export AYDB_CRASH_SEED="$AYDB_CRASH_SEED_START"
          fi
          cargo test --lib engine::crash_tests::crash_ -- --nocapture 2>&1 | tee crash.log

      - name: Multi-connection differential stress
        env:
          AYDB_MULTI_CONN_SEEDS: '100'
        run: |
          set -o pipefail
          cargo test --lib multi_conn_mixed_native_ddl_compaction_matches_oracle -- --nocapture 2>&1 | tee multi_conn.log

      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trybot-${{ matrix.os }}
          path: |
            regression.log
            crash.log
            multi_conn.log
          if-no-files-found: ignore

  kani:
    name: Kani bounded verification on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Kani toolchain and binaries
        id: kani-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
          key: kani-${{ runner.os }}-0.68.0
      - name: Install Kani 0.68.0
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --version 0.68.0 kani-verifier
          cargo kani setup
      - name: Run Kani verification
        run: |
          set -o pipefail
          cargo kani --lib 2>&1 | tee kani.log
      - name: Save Kani log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trybot-kani
          path: kani.log
          if-no-files-found: ignore
