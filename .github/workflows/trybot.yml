name: Trybot
run-name: Trybot · ${{ github.ref_name }} · seed ${{ inputs.seed_start }} (+${{ inputs.seed_count }})

on:
  workflow_dispatch:
    inputs:
      seed_start:
        description: First seed for the additional crash tests
        required: true
        type: string
        default: '4000'
      seed_count:
        description: Number of consecutive seeds per crash mode
        required: true
        type: choice
        default: '1000'
        options: ['1', '100', '1000', '5000']

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      SEED_START: ${{ inputs.seed_start }}
      SEED_COUNT: ${{ inputs.seed_count }}
    steps:
      - name: Validate seed range
        shell: python
        run: |
          import os
          start = os.environ["SEED_START"]
          count = os.environ["SEED_COUNT"]
          if not (1 <= len(start) <= 20 and start.isascii() and start.isdecimal()):
              raise SystemExit("First seed must be an unsigned decimal integer")
          if count not in {"1", "100", "1000", "5000"} or int(start) + int(count) >= 2**64:
              raise SystemExit("Invalid seed range")

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SQLite development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Regression tests
        run: cargo test --all-targets 2>&1 | tee regression.log

      - name: Additional crash tests
        env:
          AYDB_CRASH_SEED_START: ${{ inputs.seed_start }}
          AYDB_CRASH_SEEDS: ${{ inputs.seed_count }}
        run: |
          if [[ "$AYDB_CRASH_SEEDS" == 1 ]]; then
            export AYDB_CRASH_SEED="$AYDB_CRASH_SEED_START"
          fi
          cargo test --lib engine::crash_tests::crash_ -- --nocapture 2>&1 | tee crash.log

      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trybot-${{ matrix.os }}
          path: |
            regression.log
            crash.log
          if-no-files-found: ignore
