name: Trybot
run-name: Trybot · ${{ github.ref_name }} · seed ${{ inputs.seed_start }} (+${{ inputs.seed_count }})

on:
  workflow_dispatch:
    inputs:
      seed_start:
        description: First seed for the additional crash tests
        required: true
        type: string
        default: '4000'
      seed_count:
        description: Number of consecutive seeds per crash mode
        required: true
        type: choice
        default: '1000'
        options: ['1', '100', '1000', '5000']

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      SEED_START: ${{ inputs.seed_start }}
      SEED_COUNT: ${{ inputs.seed_count }}
    steps:
      - name: Validate seed range
        run: |
          export LC_ALL=C
          if [[ ! "$SEED_START" =~ ^[0-9]{1,20}$ ]]; then
            echo "First seed must be an unsigned decimal integer" >&2
            exit 1
          fi
          case "$SEED_COUNT" in
            1) limit="18446744073709551614" ;;
            100) limit="18446744073709551515" ;;
            1000) limit="18446744073709550615" ;;
            5000) limit="18446744073709546615" ;;
            *)
              echo "Invalid seed count" >&2
              exit 1
              ;;
          esac
          trimmed="${SEED_START#"${SEED_START%%[!0]*}"}"
          if [[ -z "$trimmed" ]]; then
            trimmed="0"
          fi
          printf -v padded_start "%020s" "$trimmed"
          padded_start="${padded_start// /0}"
          printf -v padded_limit "%020s" "$limit"
          padded_limit="${padded_limit// /0}"
          if [[ "$padded_start" > "$padded_limit" ]]; then
            echo "Invalid seed range" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SQLite development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Regression tests
        run: cargo test --all-targets 2>&1 | tee regression.log

      - name: Additional crash tests
        env:
          AYDB_CRASH_SEED_START: ${{ inputs.seed_start }}
          AYDB_CRASH_SEEDS: ${{ inputs.seed_count }}
        run: |
          if [[ "$AYDB_CRASH_SEEDS" == 1 ]]; then
            export AYDB_CRASH_SEED="$AYDB_CRASH_SEED_START"
          fi
          cargo test --lib engine::crash_tests::crash_ -- --nocapture 2>&1 | tee crash.log

      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trybot-${{ matrix.os }}
          path: |
            regression.log
            crash.log
          if-no-files-found: ignore
